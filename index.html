<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Animations</title>
    <style>
        #box {
            width: 300px;
            height: 300px;
            /* Ideally should initialize those properties that I will animate in the keyframes.. */
            background: red;
            animation: mymove 5s 1;
        }

        /* Animation keyframes */
        @keyframes mymove {
            0% { background: red; transform: rotateX(0deg) rotateY(0deg); }
            100% { background: green; transform: rotateX(180deg) rotateY(180deg); }
        }
    </style>
</head>
<body>
    <h1>Animation of html properties...</h1>
    <p>Gradually change the 'property' value from a to b</p>
    <div id="box">hello world</div>
</body>
</html>
