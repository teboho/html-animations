    <title>HTML Animations</title>
    <style>
        body {
            animation: bodybg-anim 5s;
            background: grey;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        #box {
            width: 100px;
            height: 100px;
            /*I wanna try and have the properties that I animate initialised..*/
            background: red; /*start color*/ 
            /*transform: rotate(0deg);*/
            animation: anim 5s 5;
        }
        #box1 {
            margin: 1em;
            width: 100px;
            height: 100px;
            background: pink; /*start color*/ 
            animation: anim1 5s 4;
        }
        #box2 {
            margin: 1em;
            width: 100px;
            height: 100px;
            background: green; /*start color*/ 
            animation: anim2 5s 3;
        }
        #box3 {
            margin: 1em;
            width: 100px;
            height: 100px;
            background: grey; /*start color*/ 
            animation: anim3 5s 5;
            border: 1px solid;
        }
        #box4 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            margin: 1em;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgb(172, 61, 61); /*start color*/ 
            animation: anim4 5s 5;
            border: 1px solid;
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        @keyframes anim {
            0% {background-color: red; transform: rotateX(0deg) rotateY(0deg);  } 
            25% {background-color: orange; }  
            50% {background-color: yellow; border-radius: 50%}
            75% {background-color: blue; }
            90% {background-color: indigo; }
            100% {background-color: violet; transform: rotateX(180deg) rotateY(360deg); } 
        }

        @keyframes anim1 {
            0% {background-color: pink; transform: skewX(0deg);  } 
            100% {background-color: green; transform: skewX(180deg) translateX(150px); } 
        }

        @keyframes anim2 {
            0% {background-color: green; transform: scaleX(1);  } 
            100% {background-color: yellow; transform: scaleX(1.5) translateX(100px) rotateY(180deg); } 
        }

        @keyframes anim3 {
            0% {background-color: green; transform: ;  } 
            50% {background-color: red; transform: translate3d(100px,-500px, -100px); } 
            100% {background-color: red; transform: rotateX(180deg); } 
        }

        @keyframes anim4 {
            0% {background-color: red;  } 
            33% {background-color: yellowgreen; transform: translateX(10em); } 
            66% {background-color: indigo; transform: translate(10em, -10em); } 
            100% {background-color: violet; transform: translate3d(15em, -15em, 5em); } 
        }

        @keyframes bodybg-anim {
            0% {background: grey; } 
            50% {background: rgb(217, 217, 217); } 
        }

        /* Animating SVGs.. */
        /* #svgs {
            transform: translateX(150px) translateY(-500px);
        } */
        svg {
            transform: translate(-100px, -900px);
            animation: move 5s infinite;
        }
        .wheel {
            animation: rotate-wheel 5s infinite;
        }
        @keyframes rotate-wheel {
            0% { transform: rotate(0deg); transform-box: fill-box; transform-origin: 50% 50%;}
            100% { transform: rotate(360deg); transform-box: fill-box; transform-origin: 50% 50%;}
        }
        @keyframes move {
            0% { transform: translateX(-100px);}
            100% { transform: translateX(250px);}
        }

        header {
            text-align: center;
        }

        /* Smartphones (portrait) ----------- */
        @media only screen and (max-width : 400px) {
            svg {
                transform: scale(0.25) translate(-100px, -900px);
                animation: move 5s infinite;
            }
        }
    </style>
